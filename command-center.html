<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08080C;
  --bg-card: #111116;
  --bg-card-hover: #16161C;
  --bg-input: #0E0E13;
  --border: #1E1E26;
  --border-light: #2A2A35;
  --gold: #C9A55C;
  --gold-dim: #A68A3A;
  --gold-glow: rgba(201,165,92,0.15);
  --text: #E8E6E1;
  --text-secondary: #8A8A8A;
  --text-muted: #555;
  --red: #E54D4D;
  --green: #4CAF6A;
  --blue: #45B7D1;
  --purple: #7B68EE;
  --agency: #C9A55C;
  --education: #45B7D1;
  --iran: #7B68EE;
  --tmn: #4CAF6A;
  --personal: #E54D4D;
  --notag: #6B6A65;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Cormorant Garamond', serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}
.app-glow {
  position: fixed; top:0; left:0; right:0; height: 400px;
  background: radial-gradient(ellipse at top, rgba(201,165,92,0.06), transparent 60%);
  pointer-events: none; z-index: 0;
}
.ramadan-bar {
  position: fixed; top:0; left:0; right:0; height: 3px;
  background: var(--border); z-index: 100;
}
.ramadan-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  transition: width 0.5s ease;
}
.container {
  max-width: 680px; margin: 0 auto; padding: 20px 16px 60px;
  position: relative; z-index: 1;
}
.tabs {
  display: flex; gap: 0; margin-bottom: 24px; margin-top: 8px;
  border-bottom: 1px solid var(--border);
}
.tab {
  padding: 10px 24px; cursor: pointer;
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--text-secondary); border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px; margin-bottom: 16px;
}
.card-glow {
  background: linear-gradient(135deg, rgba(201,165,92,0.08), rgba(201,165,92,0.02));
  border-color: rgba(201,165,92,0.2);
}
.section-header {
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-secondary); margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.5px;
}
input, select, textarea {
  background: var(--bg-input); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px; padding: 8px 12px;
  font-family: 'Cormorant Garamond', serif; font-size: 16px;
  outline: none; width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--gold); }
select { font-size: 13px; font-family: 'JetBrains Mono', monospace; }
textarea { resize: vertical; min-height: 60px; }
button {
  cursor: pointer; border: none; font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
  padding: 8px 16px; border-radius: 6px; transition: all 0.2s;
}
.btn-gold {
  background: var(--gold); color: #08080C; font-weight: 600;
}
.btn-gold:hover { background: #D4B06A; }
.btn-ghost {
  background: transparent; color: var(--text-secondary);
  border: 1px solid var(--border);
}
.btn-ghost:hover { color: var(--text); border-color: var(--border-light); }
.btn-sm { padding: 4px 10px; font-size: 10px; }
.btn-icon {
  background: transparent; color: var(--text-muted); padding: 4px;
  font-size: 14px; border-radius: 4px; min-width: 28px;
}
.btn-icon:hover { color: var(--text); background: var(--bg-card-hover); }
.checkbox {
  width: 18px; height: 18px; border: 2px solid var(--border-light);
  border-radius: 4px; cursor: pointer; display: flex;
  align-items: center; justify-content: center; flex-shrink: 0;
  transition: all 0.2s; background: transparent;
}
.checkbox.checked {
  background: var(--gold); border-color: var(--gold);
}
.checkbox.checked::after {
  content: '\2713'; color: #08080C; font-size: 12px; font-weight: 700;
}
.progress-bar {
  height: 4px; background: var(--border); border-radius: 2px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  transition: width 0.3s ease;
}
.mini-cal {
  display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px;
  scrollbar-width: none;
}
.mini-cal::-webkit-scrollbar { display: none; }
.mini-cal-day {
  min-width: 52px; padding: 8px 6px; border-radius: 8px;
  text-align: center; cursor: pointer; border: 1px solid transparent;
  transition: all 0.2s; flex-shrink: 0;
}
.mini-cal-day:hover { background: var(--bg-card-hover); }
.mini-cal-day.today { border-color: var(--gold); }
.mini-cal-day.selected { background: var(--gold-glow); border-color: rgba(201,165,92,0.3); }
.mini-cal-day .day-name {
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;
}
.mini-cal-day .day-num { font-size: 18px; font-weight: 600; margin: 2px 0; }
.mini-cal-day .day-prog { height: 2px; background: var(--border); border-radius: 1px; margin-top: 4px; }
.mini-cal-day .day-prog-fill { height: 100%; background: var(--gold); border-radius: 1px; }
.energy-btn {
  padding: 12px 16px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text); font-size: 14px; text-align: center;
  transition: all 0.2s; flex: 1;
}
.energy-btn:hover { border-color: var(--gold); background: var(--bg-card-hover); }
.task-item {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.task-item:last-child { border-bottom: none; }
.task-text { flex: 1; font-size: 16px; line-height: 1.4; }
.task-text.done { text-decoration: line-through; opacity: 0.4; }
.task-meta { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.task-actions { display: flex; gap: 2px; flex-shrink: 0; }
.highlight-card {
  background: linear-gradient(135deg, rgba(201,165,92,0.12), rgba(201,165,92,0.04));
  border: 1px solid rgba(201,165,92,0.25); border-radius: 8px;
  padding: 16px; text-align: center;
}
.highlight-input {
  border: 2px dashed var(--border-light); border-radius: 8px;
  padding: 16px; text-align: center; background: transparent;
}
.timer-display {
  font-family: 'JetBrains Mono', monospace; font-size: 48px;
  text-align: center; letter-spacing: 4px; margin: 12px 0;
}
.timer-controls { display: flex; gap: 8px; justify-content: center; }
.routine-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.routine-item:last-child { border-bottom: none; }
.streak { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold); }
.weekly-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
  margin-bottom: 12px;
}
.weekly-grid-day {
  text-align: center; padding: 8px 4px; border-radius: 6px;
  background: var(--bg-card); border: 1px solid var(--border);
}
.weekly-grid-day .grade {
  font-family: 'JetBrains Mono', monospace; font-size: 16px;
  font-weight: 600;
}
.stat-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; text-align: center;
}
.stat-card .stat-val {
  font-family: 'JetBrains Mono', monospace; font-size: 20px;
  font-weight: 600; color: var(--gold);
}
.stat-card .stat-label {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px;
  margin-top: 4px;
}
.milestone-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px; margin-bottom: 10px;
}
.goal-item {
  display: flex; align-items: center; gap: 8px; padding: 6px 0;
}
.project-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.trophy-animation {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 80px; z-index: 1000;
  animation: trophyPop 1.5s ease-out forwards;
}
@keyframes trophyPop {
  0% { opacity:0; transform: translate(-50%,-50%) scale(0.3); }
  30% { opacity:1; transform: translate(-50%,-50%) scale(1.2); }
  60% { opacity:1; transform: translate(-50%,-50%) scale(1); }
  100% { opacity:0; transform: translate(-50%,-70%) scale(1); }
}
.quote-section {
  text-align: center; padding: 24px 16px; margin-top: 24px;
  color: var(--text-secondary); font-size: 15px; font-style: italic;
  direction: rtl; line-height: 1.8;
}
.add-input-row {
  display: flex; gap: 8px; align-items: center;
}
.add-input-row input { flex: 1; }
.detail-panel {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin-top: 8px; padding: 12px; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: 8px;
}
.detail-panel select { font-size: 12px; padding: 6px 8px; }
.win-item {
  padding: 8px 12px; border-radius: 6px;
  background: rgba(76,175,106,0.08); border-left: 3px solid var(--green);
  margin-bottom: 6px; font-size: 14px;
}
.win-item .win-time {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--text-muted); margin-top: 2px;
}
.review-prompt {
  margin-bottom: 16px;
}
.review-prompt label {
  display: block; font-family: 'JetBrains Mono', monospace;
  font-size: 12px; color: var(--text-secondary); margin-bottom: 6px;
}
.review-prompt .hint {
  font-size: 11px; color: var(--text-muted); margin-top: 4px;
  font-style: italic;
}
.emoji-grid {
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px;
  margin: 8px 0;
}
.emoji-btn {
  padding: 6px; text-align: center; font-size: 18px; cursor: pointer;
  border-radius: 4px; background: var(--bg-card); border: 1px solid var(--border);
}
.emoji-btn:hover, .emoji-btn.selected { border-color: var(--gold); background: var(--gold-glow); }
.goals-strip-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 6px; margin-bottom: 6px; font-size: 14px;
}
.score-grade {
  font-family: 'JetBrains Mono', monospace; font-size: 32px;
  font-weight: 700; color: var(--gold);
}
.inline-edit {
  background: transparent; border: none; border-bottom: 1px solid var(--gold);
  color: var(--text); font-family: 'Cormorant Garamond', serif;
  font-size: 16px; outline: none; width: 100%; padding: 0;
}
.backlog-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.backlog-item:last-child { border-bottom: none; }
.rolled-badge {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--purple); background: rgba(123,104,238,0.1);
  padding: 1px 6px; border-radius: 3px;
}
.rolled-warn {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--red); background: rgba(229,77,77,0.1);
  padding: 1px 6px; border-radius: 3px;
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
// ===================== CONSTANTS =====================
const PROJECTS = [
  { id: 'agency', name: 'Agency', color: '#C9A55C' },
  { id: 'education', name: 'Education', color: '#45B7D1' },
  { id: 'iran', name: 'Iran Team', color: '#7B68EE' },
  { id: 'tmn', name: 'TMN', color: '#4CAF6A' },
  { id: 'personal', name: 'Personal', color: '#E54D4D' },
  { id: 'notag', name: 'No Tag', color: '#6B6A65' }
];
const PRIORITIES = [
  { id: 'must', label: 'Must Do', icon: '\uD83D\uDD34', color: '#E54D4D' },
  { id: 'should', label: 'Should Do', icon: '\uD83D\uDFE1', color: '#C9A55C' },
  { id: 'nice', label: 'Nice to Have', icon: '\u26AA', color: '#6B6A65' }
];
const TIME_BLOCKS = [
  { id: 'morning', label: 'Morning', icon: '\u2600\uFE0F', desc: '11 AM \u2013 2 PM' },
  { id: 'afternoon', label: 'Afternoon', icon: '\uD83C\uDF24', desc: '2 PM \u2013 6 PM' },
  { id: 'evening', label: 'Evening', icon: '\uD83C\uDF19', desc: 'After Iftar' },
  { id: 'anytime', label: 'Anytime', icon: '\u23F3', desc: '' }
];
const DEFAULT_ROUTINES = [
  { id: 'r1', label: '5 Daily Prayers', emoji: '\uD83E\uDD32', mode: 'daily', target: 1 },
  { id: 'r2', label: 'Night Prayer', emoji: '\uD83C\uDF19', mode: 'weekly', target: 3 },
  { id: 'r3', label: 'Ziarat Nafs Ali', emoji: '\uD83D\uDCFF', mode: 'daily', target: 1 },
  { id: 'r4', label: 'Gym', emoji: '\uD83C\uDFCB\uD83C\uDFFB', mode: 'cycle', target: 5 },
  { id: 'r5', label: 'Read 25 min', emoji: '\uD83D\uDCD6', mode: 'daily', target: 1 },
  { id: 'r6', label: 'Study 1h', emoji: '\uD83D\uDCDA', mode: 'daily', target: 1 },
  { id: 'r7', label: 'Lead Gen 2h', emoji: '\uD83D\uDD28', mode: 'daily', target: 1 }
];
const QUOTES = [
  '\u0625\u0650\u0646\u0651\u064E \u0645\u064E\u0639\u064E \u0627\u0644\u0652\u0639\u064F\u0633\u0652\u0631\u0650 \u064A\u064F\u0633\u0652\u0631\u064B\u0627 \u2014 with hardship comes ease',
  '\u062A\u0648\u06A9\u0644 \u0628\u0631 \u062E\u062F\u0627 \u06A9\u0646\u060C \u06A9\u0627\u0631 \u062E\u0648\u062F \u0631\u0627 \u0628\u0647 \u0627\u0648 \u0628\u0633\u067E\u0627\u0631',
  '\u0648\u064E\u0645\u064E\u0646 \u064A\u064E\u062A\u064E\u0648\u064E\u0643\u0651\u064E\u0644\u0652 \u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0644\u0651\u064E\u0647\u0650 \u0641\u064E\u0647\u064F\u0648\u064E \u062D\u064E\u0633\u0652\u0628\u064F\u0647\u064F \u2014 whoever relies on Allah, He is sufficient',
  '\u0641\u064E\u0625\u0650\u0646\u0651\u064E \u0630\u0650\u0643\u0652\u0631\u064E \u0627\u0644\u0644\u0651\u064E\u0647\u0650 \u062A\u064E\u0637\u0652\u0645\u064E\u0626\u0650\u0646\u0651\u064F \u0627\u0644\u0652\u0642\u064F\u0644\u064F\u0648\u0628\u064F \u2014 in remembrance of Allah hearts find peace',
  '\u0631\u064E\u0628\u0651\u0650 \u0627\u0634\u0652\u0631\u064E\u062D\u0652 \u0644\u0650\u064A \u0635\u064E\u062F\u0652\u0631\u0650\u064A \u0648\u064E\u064A\u064E\u0633\u0651\u0650\u0631\u0652 \u0644\u0650\u064A \u0623\u064E\u0645\u0652\u0631\u0650\u064A \u2014 expand my chest and ease my task',
  '\u064A\u0627 \u0639\u064E\u0644\u0650\u064A\u0651\u064F \u064A\u0627 \u0639\u064E\u0638\u064A\u0645 \u00B7 \u064A\u0627 \u0639\u064E\u0644\u0650\u064A\u0651\u064F \u064A\u0627 \u062D\u064E\u0644\u064A\u0645',
  '\u0627\u064E\u0644\u0644\u0651\u0647\u064F\u0645\u0651\u064E \u06A9\u064F\u0646 \u0644\u0650\u0648\u064E\u0644\u0650\u064A\u0651\u0650\u06A9\u064E \u0627\u0644\u062D\u064F\u062C\u0651\u064E\u0629\u0650 \u0628\u0646\u0650 \u0627\u0644\u062D\u064E\u0633\u064E\u0646'
];
const EMOJI_OPTIONS = ['\uD83D\uDCDA','\uD83D\uDCD6','\uD83D\uDCAA','\uD83C\uDFCB\uD83C\uDFFB','\uD83E\uDDD8','\uD83E\uDD32','\uD83C\uDF19','\uD83D\uDCFF','\uD83D\uDD28','\u2708\uFE0F','\uD83D\uDCBB','\uD83C\uDFA8','\u2615','\uD83C\uDF45','\uD83C\uDFAF','\u2764\uFE0F'];
const RAMADAN_START = new Date(2026, 1, 18);
const RAMADAN_DAYS = 30;

// ===================== UTILITIES =====================
function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
function fmtDate(d) {
  var dd = d instanceof Date ? d : new Date(d);
  var y = dd.getFullYear(), m = String(dd.getMonth()+1).padStart(2,'0'), day = String(dd.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + day;
}
function parseDate(s) { var p = s.split('-'); return new Date(Number(p[0]), Number(p[1])-1, Number(p[2])); }
function getWeekStart(d) {
  var dd = new Date(d); var day = dd.getDay();
  var diff = dd.getDate() - day + (day === 0 ? -6 : 1);
  dd.setDate(diff); dd.setHours(0,0,0,0); return fmtDate(dd);
}
function getMonthKey(d) { var dd = d instanceof Date ? d : new Date(d); return dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0'); }
function getDayName(d) { return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]; }
function getFullDate(d) {
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  return days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}
function getRamadanInfo(d) {
  var diff = Math.floor((d - RAMADAN_START) / (1000*60*60*24));
  var dayNum = diff + 1;
  if (dayNum < 1 || dayNum > RAMADAN_DAYS) return null;
  return { day: dayNum, left: RAMADAN_DAYS - dayNum, progress: dayNum / RAMADAN_DAYS };
}
function isSameDay(a, b) { return fmtDate(a) === fmtDate(b); }

function loadJSON(key, fallback) { try { var d = localStorage.getItem(key); return d ? JSON.parse(d) : fallback; } catch(e) { return fallback; } }
function saveJSON(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

function calculateGrade(routinePct, taskPct) {
  var score = routinePct * 0.5 + taskPct * 0.5;
  if (score >= 95) return 'A+'; if (score >= 85) return 'A'; if (score >= 75) return 'B+';
  if (score >= 65) return 'B'; if (score >= 55) return 'C+'; if (score >= 45) return 'C';
  if (score >= 35) return 'D'; return 'F';
}
function gradeColor(g) {
  if (g === 'A+' || g === 'A') return '#C9A55C';
  if (g === 'B+' || g === 'B') return '#45B7D1';
  if (g === 'C+' || g === 'C') return '#6B6A65';
  return '#E54D4D';
}
function getProjectColor(pid) { var p = PROJECTS.find(function(x){return x.id===pid}); return p ? p.color : '#6B6A65'; }
function getProjectName(pid) { var p = PROJECTS.find(function(x){return x.id===pid}); return p ? p.name : 'No Tag'; }
function getPriorityOrder(pid) { if (pid === 'must') return 0; if (pid === 'should') return 1; return 2; }

function getRoutineStreak(routineId, routineLog) {
  var streak = 0;
  var d = new Date(); d.setDate(d.getDate() - 1);
  for (var i = 0; i < 365; i++) {
    var key = fmtDate(d) + '-' + routineId;
    if (routineLog[key]) { streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  var todayKey = fmtDate(new Date()) + '-' + routineId;
  if (routineLog[todayKey]) streak++;
  return streak;
}
function getWeeklyRoutineCount(routineId, routineLog) {
  var ws = getWeekStart(new Date());
  var start = parseDate(ws);
  var count = 0;
  for (var i = 0; i < 7; i++) {
    var d = new Date(start); d.setDate(d.getDate() + i);
    var key = fmtDate(d) + '-' + routineId;
    if (routineLog[key]) count++;
  }
  return count;

        React.createElement('div', { style: { marginBottom: 24 } },
          React.createElement(SectionHeader, { title: '\uD83D\uDCCB Weekly Goals' }),
          PROJECTS.map(function(proj) {
            return React.createElement(ProjectWeeklyGoals, {
              key: proj.id, project: proj, weeklyGoals: weeklyGoals, tasks: tasks,
              onToggleGoal: toggleWeeklyGoal, onPlusTask: handlePlusTask,
              onAddGoal: addWeeklyGoal, onDeleteGoal: deleteWeeklyGoal
            });
          })
        ),

        // Weekly Review
        React.createElement('div', { className: 'card' },
          React.createElement(SectionHeader, { title: '\uD83D\uDD0D Weekly Review' }),
          [
            { key: 'done', label: 'What got done?' },
            { key: 'rolling', label: 'What kept rolling?' },
            { key: 'win', label: 'ONE win?' },
            { key: 'avoiding', label: 'What am I avoiding?' },
            { key: 'focus', label: "Next week's focus?" }
          ].map(function(prompt) {
            return React.createElement('div', { key: prompt.key, className: 'review-prompt' },
              React.createElement('label', null, prompt.label),
              React.createElement('textarea', {
                value: weekReview[prompt.key] || '',
                onChange: function(e) { updateReview(prompt.key, e.target.value); },
                placeholder: 'Reflect...'
              }),
              React.createElement('div', { className: 'hint' }, 'Reflect in Sirr journal')
            );
          }),

          // Week's wins
          allWeekWins.length > 0 ? React.createElement('div', { style: { marginTop: 16 } },
            React.createElement(SectionHeader, { title: "\uD83C\uDFC6 This Week's Wins" }),
            allWeekWins.map(function(w, i) {
              return React.createElement('div', { key: i, className: 'win-item' },
                React.createElement('div', null, w.text),
                React.createElement('div', { className: 'win-time' }, w.date + ' \u00B7 ' + w.time)
              );
            })
          ) : null
        )

      ) : null,

      // Spiritual Quote
      React.createElement('div', { className: 'quote-section' }, todayQuote)
    )
  );
}

// ===================== RENDER =====================
var root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(CommandCenter));
</script>
</body>
</html>
